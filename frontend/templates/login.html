<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login AMIGA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f6fb;
            color: #17243b;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: #fff;
            border: 1px solid #e3e8f0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(23, 36, 59, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        p {
            margin: 0 0 24px;
            color: #65728a;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd3df;
            border-radius: 8px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #234b8a;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            margin: 12px 0;
            padding: 11px;
            border-radius: 8px;
            background: #fff0f0;
            color: #a12a2a;
        }
    </style>
</head>
<body>
    <main>
        <h1>AMIGA</h1>
        <p>Masuk ke akun kamu untuk melanjutkan.</p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form method="post">
            <input
                type="hidden"
                name="next"
                value="{{ next_url or '' }}"
            >

            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Masuk</button>
        </form>
    </main>
</body>
</html>
